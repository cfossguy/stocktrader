    "ecs-logging>=2.2.0",
    "ray[all]>=2.40.0",
    "yfinance-cache>=0.7.1",
    "pydantic>=2.10.4",
    "lxml>=5.3.1",
    "fast-agent-mcp>=0.2.45",
    "setuptools>=80.9.0",
    "crewai>=0.152.0",
    "crewai_tools>=0.1.0"
